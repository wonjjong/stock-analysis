# flat layout 에 최상위 디렉터리가 셋(news·research·signalist)이라 setuptools 자동탐색이
# 어느 것이 패키지인지 정하지 못하고 실패한다. 명시한다.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["news*", "research*", "signalist*"]

[project]
name = "signalist"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "django>=5.2,<6",
  "psycopg[binary]>=3.2,<4",
  # 크롤러가 쓰는 HTTP 클라이언트. 전체 작업 데드라인을 걸 수 있어야 하므로
  # requests 대신 httpx 를 쓴다(TS 의 AbortSignal.timeout 의미를 재현).
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-django>=4.9,<5",
  "ruff>=0.8,<1",
]

# 이식 방침: dateutil / feedparser / beautifulsoup4 / trafilatura 를 쓰지 않는다.
#  - dateutil    : Date.parse 보다 관대해서 기사 번호·스코어를 날짜로 오인한다
#  - feedparser  : HTML 을 sanitize 해 excerpt 가 달라지고 content_hash 가 전부 바뀐다
#  - bs4         : anchorContext 의 문자 오프셋 윈도를 표현할 수 없다
#  - trafilatura : 이 크롤러는 목록 페이지만 읽는다(전문 추출용 도구가 필요 없다)
# 자세한 근거는 README 의 「주의할 함정」 참고.

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "signalist.settings.test"
pythonpath = ["."]
testpaths = ["news", "signalist", "research"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# JS `\s` 집합을 그대로 적으려면 이색 공백 문자들이 리터럴로 있어야 한다.
# 그것이 이 상수의 존재 이유이므로 "모호한 문자" 경고를 끈다.
"news/crawler/text.py" = ["RUF001"]
# 전각 숫자가 JS `\d`(ASCII 전용)와 Python `\d`(유니코드)의 차이를 검증하는 입력이다.
"news/crawler/dates.py" = ["RUF002"]
"news/tests/test_parity_dates.py" = ["RUF001"]
# TS 원본에서 기계 생성한 데이터. 줄 길이를 맞추려 손대면 재생성 시 diff 가 생긴다.
"news/crawler/symbol_data.py" = ["E501"]
# Meta.ordering 등은 Django 규약이며 ClassVar 주석이 부자연스럽다.
"news/models.py" = ["RUF012"]
# 마이그레이션은 Django 가 생성하는 형식이다. 손으로 다듬으면 makemigrations 가
# 다시 덮어쓰거나 diff 가 생긴다.
"news/migrations/*" = ["RUF012", "E501"]
# rank_candidates 는 `api/` 프로토타입에서 **바이트 동일**하게 옮긴 것이다. 순수 stdlib
# 로 완성된 팩터 알고리즘이고 테스트 2개가 붙어 있다. 형식을 다듬으면 원본과의 동일성이
# 깨지고, 이 파일이 실제로 쓰이기 시작할 때(리서치 엔진) 리팩터링과 함께 정리한다.
"research/recommendation.py" = ["E501", "E701", "E702"]
"research/test_recommendation.py" = ["E501"]
