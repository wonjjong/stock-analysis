[project]
name = "signalist-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1", "httpx>=0.28,<1",
  "openai>=1.68,<3", "beautifulsoup4>=4.13,<5", "trafilatura>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"
